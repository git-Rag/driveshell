name: Bug Report
description: Report a defect in DriveShell
labels: ['bug', 'needs-triage']
body:
  - type: markdown
    attributes:
      value: |
        **Security vulnerabilities:** please use [private reporting](../security) instead of this form.

  - type: input
    id: version
    attributes:
      label: DriveShell version
      placeholder: 'e.g. 0.3.1 or git SHA'
    validations:
      required: true

  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - Windows
        - macOS
        - Linux
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: A clear and concise description of the bug.
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open ...
        2. Click ...
        3. See error
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Relevant logs or error messages
      description: Paste any server logs (redact tokens and file names).
      render: shell
