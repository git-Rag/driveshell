[package]
name = "project-sunflower-desktop"
version = "1.0.0"
description = "Project Sunflower — Fast, local-first Google Drive photo-first client"
authors = ["git-Rag"]
edition = "2021"

[lib]
name = "project_sunflower_desktop"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.0.0", features = [] }

[dependencies]
tauri = { version = "2.0.0", features = ["tray-icon"] }
tauri-plugin-shell = "2.0.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[features]
custom-protocol = ["tauri/custom-protocol"]

