<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="petalGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <linearGradient id="centerGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Background container -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>

  <!-- Sunflower group -->
  <g transform="translate(256, 256)" filter="url(#shadow)">
    <!-- 12 Petals rotated evenly -->
    <path d="M 0,-180 C 32,-110 32,-60 0,-40 C -32,-60 -32,-110 0,-180 Z" fill="url(#petalGrad)"/>
    <path d="M 0,-180 C 32,-110 32,-60 0,-40 C -32,-60 -32,-110 0,-180 Z" fill="url(#petalGrad)" transform="rotate(30)"/>
    <path d="M 0,-180 C 32,-110 32,-60 0,-40 C -32,-60 -32,-110 0,-180 Z" fill="url(#petalGrad)" transform="rotate(60)"/>
    <path d="M 0,-180 C 32,-110 32,-60 0,-40 C -32,-60 -32,-110 0,-180 Z" fill="url(#petalGrad)" transform="rotate(90)"/>
    <path d="M 0,-180 C 32,-110 32,-60 0,-40 C -32,-60 -32,-110 0,-180 Z" fill="url(#petalGrad)" transform="rotate(120)"/>
    <path d="M 0,-180 C 32,-110 32,-60 0,-40 C -32,-60 -32,-110 0,-180 Z" fill="url(#petalGrad)" transform="rotate(150)"/>
    <path d="M 0,-180 C 32,-110 32,-60 0,-40 C -32,-60 -32,-110 0,-180 Z" fill="url(#petalGrad)" transform="rotate(180)"/>
    <path d="M 0,-180 C 32,-110 32,-60 0,-40 C -32,-60 -32,-110 0,-180 Z" fill="url(#petalGrad)" transform="rotate(210)"/>
    <path d="M 0,-180 C 32,-110 32,-60 0,-40 C -32,-60 -32,-110 0,-180 Z" fill="url(#petalGrad)" transform="rotate(240)"/>
    <path d="M 0,-180 C 32,-110 32,-60 0,-40 C -32,-60 -32,-110 0,-180 Z" fill="url(#petalGrad)" transform="rotate(270)"/>
    <path d="M 0,-180 C 32,-110 32,-60 0,-40 C -32,-60 -32,-110 0,-180 Z" fill="url(#petalGrad)" transform="rotate(300)"/>
    <path d="M 0,-180 C 32,-110 32,-60 0,-40 C -32,-60 -32,-110 0,-180 Z" fill="url(#petalGrad)" transform="rotate(330)"/>

    <!-- Inner circle / Drive core -->
    <circle r="72" fill="url(#centerGrad)"/>
    <!-- Hard drive / Cloud symbol inside -->
    <path d="M -30,-8 L 30,-8 C 36,-8 40,-4 40,2 L 40,16 C 40,22 36,26 30,26 L -30,26 C -36,26 -40,22 -40,16 L -40,2 C -40,-4 -36,-8 -30,-8 Z" fill="#ffffff" opacity="0.95"/>
    <circle cx="22" cy="9" r="4" fill="#2563eb"/>
    <circle cx="10" cy="9" r="4" fill="#60a5fa"/>
  </g>
</svg>
